<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
    <script src="/static/common.js"></script>
  <title>PrivacyLab Queries</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    select, input { padding: 6px; width: 320px; }
    button { margin-top: 16px; padding: 8px 16px; }
    table { border-collapse: collapse; margin-top: 12px; }
    td, th { border: 1px solid #ccc; padding: 4px 10px; text-align: left; }
    .err { color: #b00020; } .ok { color: #1b7f3b; }
    .box { background: #f5f5f5; padding: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Run a private query</h2>
  <p><a href="/dashboard">&larr; Back to dashboard</a></p>

  <label>Dataset</label>
  <select id="dataset" onchange="onDatasetChange()"></select>
  <div id="budget"></div>

  <label>Operation</label>
  <select id="operation">
    <option value="count">count</option>
    <option value="sum">sum</option>
    <option value="mean">mean</option>
  </select>

  <label>Column (for sum / mean)</label>
  <select id="column"></select>

  <label>Group by (optional)</label>
  <select id="group"></select>

  <label>Epsilon (0.01 to 2.0)</label>
  <input id="epsilon" type="number" step="0.01" value="0.5">

  <label>Mechanism</label>
  <select id="mechanism">
    <option value="laplace">laplace</option>
    <option value="gaussian">gaussian (epsilon must be below 1)</option>
  </select>

  <button onclick="run()">Run query</button>

  <ul id="errors" class="err"></ul>
  <div id="result"></div>

  <script>
    let datasets = [];

    function addOption(select, value, label) {
      const o = document.createElement("option");
      o.value = value;
      o.textContent = label;
      select.appendChild(o);
    }

    function add(parent, tag, text, cls) {
      const el = document.createElement(tag);
      el.textContent = text;
      if (cls) el.className = cls;
      parent.appendChild(el);
      return el;
    }

    function currentDataset() {
      return datasets.find(d => d.id === document.getElementById("dataset").value);
    }

    function onDatasetChange() {
      const ds = currentDataset();
      const col = document.getElementById("column");
      const grp = document.getElementById("group");
      col.innerHTML = "";
      grp.innerHTML = "";
      addOption(grp, "", "(none)");
      if (!ds) return;
      JSON.parse(ds.columns).forEach(c => {
        addOption(col, c, c);
        addOption(grp, c, c);
      });
      document.getElementById("budget").textContent =
        "Budget used: " + ds.epsilon_spent + " of " + ds.epsilon_budget;
    }

    async function loadDatasets() {
      const res = await fetch("/api/datasets");
      if (!res.ok) {
        document.getElementById("budget").textContent =
          "Could not load datasets (status " + res.status + "). Log in as analyst or admin.";
        return;
      }
      datasets = await res.json();
      const sel = document.getElementById("dataset");
      const previous = sel.value;
      sel.innerHTML = "";
      datasets.forEach(d => addOption(sel, d.id, d.filename + " (" + d.id.slice(0, 8) + ")"));
      if (datasets.length === 0) {
        document.getElementById("budget").textContent =
          "No datasets yet. Upload one on the dashboard first.";
        return;
      }
      if (previous && datasets.some(d => d.id === previous)) sel.value = previous;
      onDatasetChange();
    }

    async function run() {
      const errs = document.getElementById("errors");
      const out = document.getElementById("result");
      errs.innerHTML = "";
      out.innerHTML = "";
      const ds = currentDataset();
      if (!ds) { add(errs, "li", "Upload a dataset first"); return; }

      const body = {
        dataset_id: ds.id,
        operation: document.getElementById("operation").value,
        column: document.getElementById("column").value || null,
        group_by: document.getElementById("group").value || null,
        epsilon: parseFloat(document.getElementById("epsilon").value),
        mechanism: document.getElementById("mechanism").value
      };

      const res = await fetch("/api/query", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (!res.ok) {
        const items = Array.isArray(data.detail) ? data.detail : ["Request failed"];
        items.forEach(t => add(errs, "li", typeof t === "string" ? t : "Invalid request"));
        loadDatasets();
        return;
      }

      add(out, "p", data.cached
        ? "Repeat query: saved answer returned, no budget charged."
        : "Budget charged: " + data.epsilon_charged, "ok");
      add(out, "p", "Budget remaining: " + data.budget_remaining);

      const table = add(out, "table", "");
      const head = add(table, "tr", "");
      ["Group", "Noisy value", "Noise scale"].forEach(h => add(head, "th", h));
      data.rows.forEach(r => {
        const tr = add(table, "tr", "");
        [r.group, r.value, r.noise_scale].forEach(v => add(tr, "td", v));
      });
      if (data.suppressed_groups > 0) {
        add(out, "p", data.suppressed_groups + " small group(s) hidden to protect privacy.", "err");
      }

      const box = add(out, "div", "", "box");
      add(box, "b", "Evidence");
      Object.entries(data.evidence).forEach(([k, v]) => {
        add(box, "div", k + ": " + (v === null ? "-" : JSON.stringify(v)));
      });

      const ex = data.explanation;
      const rbox = add(out, "div", "", "box");
      add(rbox, "b", "Privacy risk: " + ex.risk_level);
      add(rbox, "div", ex.summary);
      ex.reasons.forEach(r => add(rbox, "div", "[" + r.level + "] " + r.rule + ": " + r.detail));
      add(rbox, "div", "Recommended action: " + ex.recommended_action);

      loadDatasets();
    }

    async function init() {
      const me = await fetch("/api/me");
      if (!me.ok) { window.location = "/"; return; }
      loadDatasets();
    }
    init();
  </script>
</body>
</html>
